<div class="auth-wrap">
  <div class="auth-card" style="align-items: center; text-align: center">
    @if (status() === 'processing') {
      <app-loader [dot]="10" [gap]="6" />
      <p class="auth-sub" style="margin-top: 16px">{{ 'auth.processing' | t }}</p>
    } @else {
      <span class="mi" style="font-size: 40px; color: var(--danger)">error_outline</span>
      <h1 class="auth-title" style="font-size: 20px; margin-top: 12px">
        {{ 'auth.linkExpired' | t }}
      </h1>
      <a routerLink="/login" class="auth-btn" style="margin-top: 20px; text-decoration: none; justify-content: center">
        {{ 'auth.backToLogin' | t }}
      </a>
    }
  </div>
</div>
