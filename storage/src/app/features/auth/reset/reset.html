<div class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title">{{ 'app.title' | t }}</h1>
    <p class="auth-sub">{{ 'auth.resetTitle' | t }}</p>

    @switch (status()) {
      @case ('waiting') {
        <div style="display: flex; align-items: center; gap: 12px">
          <app-loader [dot]="8" [gap]="5" />
          <span class="auth-sub" style="margin: 0">{{ 'auth.processing' | t }}</span>
        </div>
      }
      @case ('invalid') {
        <div class="auth-error">{{ 'auth.resetInvalid' | t }}</div>
        <p class="auth-foot">
          <a routerLink="/login" class="auth-link">{{ 'auth.backToLogin' | t }}</a>
        </p>
      }
      @case ('ready') {
        @if (error()) {
          <div class="auth-error">{{ error() }}</div>
        }
        @if (info()) {
          <div class="auth-info">{{ info() }}</div>
        }
        <form (submit)="submit($event)">
          <label class="auth-label">{{ 'auth.newPassword' | t }}</label>
          <app-password-input
            autocomplete="new-password"
            [placeholder]="'auth.newPassword' | t"
            [value]="password()"
            [required]="true"
            (valueChange)="password.set($event)"
          />

          <label class="auth-label">{{ 'auth.confirmPassword' | t }}</label>
          <app-password-input
            autocomplete="new-password"
            [placeholder]="'auth.confirmPassword' | t"
            [value]="confirm()"
            [required]="true"
            (valueChange)="confirm.set($event)"
          />

          <button class="auth-btn" type="submit" [disabled]="loading()">
            {{ loading() ? ('auth.sending' | t) : ('auth.updatePassword' | t) }}
          </button>
        </form>
      }
    }
  </div>
</div>
