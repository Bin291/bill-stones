@if (error()) {
  <div class="auth-error">{{ error() }}</div>
}
@if (info()) {
  <div class="auth-info">{{ info() }}</div>
}

@if (step() === 'email') {
  <form (submit)="sendCode($event)">
    <label class="auth-label">{{ 'auth.email' | t }}</label>
    <input
      class="auth-input"
      type="email"
      autocomplete="email"
      inputmode="email"
      [placeholder]="'auth.emailPlaceholder' | t"
      [value]="email()"
      (input)="email.set($any($event.target).value)"
      required
    />
    <button class="auth-btn" type="submit" [disabled]="loading()">
      {{ loading() ? ('auth.sending' | t) : ('auth.sendCode' | t) }}
    </button>
  </form>
} @else {
  <form (submit)="verifyCode($event)">
    <label class="auth-label">{{ 'auth.enterOtp' | t }}</label>
    <input
      class="auth-input"
      style="letter-spacing: 8px; font-size: 20px; text-align: center"
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      maxlength="6"
      placeholder="••••••"
      [value]="otp()"
      (input)="onOtpInput($any($event.target).value)"
      required
    />
    <button class="auth-btn" type="submit" [disabled]="loading() || otp().length < 6">
      {{ loading() ? ('auth.verifying' | t) : ('auth.verify' | t) }}
    </button>

    <div class="row" style="justify-content: space-between; margin-top: 14px">
      <button
        class="auth-link"
        type="button"
        style="background: none; border: none; cursor: pointer; padding: 0"
        [disabled]="resendIn() > 0 || loading()"
        (click)="resend()"
      >
        {{ resendIn() > 0 ? ('auth.resendIn' | t: { s: resendIn() }) : ('auth.resend' | t) }}
      </button>
      <button
        class="auth-link"
        type="button"
        style="background: none; border: none; cursor: pointer; padding: 0"
        (click)="changeEmail()"
      >
        {{ 'auth.changeEmail' | t }}
      </button>
    </div>
  </form>
}
