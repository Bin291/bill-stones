@if (error()) {
  <div class="auth-error">{{ error() }}</div>
}
@if (info()) {
  <div class="auth-info">{{ info() }}</div>
}

@if (step() === 'email') {
  <form (submit)="sendLink($event)">
    <label class="auth-label">{{ 'auth.email' | t }}</label>
    <input
      class="auth-input"
      type="email"
      autocomplete="email"
      inputmode="email"
      [placeholder]="'auth.emailPlaceholder' | t"
      [value]="email()"
      (input)="email.set($any($event.target).value)"
      required
    />
    <button class="auth-btn" type="submit" [disabled]="loading()">
      {{ loading() ? ('auth.sending' | t) : ('auth.sendLink' | t) }}
    </button>
  </form>
} @else {
  <div class="auth-sent">
    <span class="mi auth-sent-icon">mark_email_read</span>
    <p class="auth-sent-text">{{ 'auth.linkSent' | t }}</p>
    <p class="auth-sent-email">{{ email() }}</p>

    <div class="row" style="justify-content: space-between; margin-top: 14px">
      <button
        class="auth-link"
        type="button"
        style="background: none; border: none; cursor: pointer; padding: 0"
        [disabled]="resendIn() > 0 || loading()"
        (click)="resend()"
      >
        {{ resendIn() > 0 ? ('auth.resendIn' | t: { s: resendIn() }) : ('auth.resend' | t) }}
      </button>
      <button
        class="auth-link"
        type="button"
        style="background: none; border: none; cursor: pointer; padding: 0"
        (click)="changeEmail()"
      >
        {{ 'auth.changeEmail' | t }}
      </button>
    </div>
  </div>
}
