<div class="modal-backdrop" (click)="close()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-head">
      <span><span class="mi">share</span> {{ target().name }}</span>
      <button class="btn btn-icon" type="button" (click)="close()"><span class="mi">close</span></button>
    </div>

    @if (error()) {
      <div class="auth-error" style="margin: 12px 16px 0">{{ error() }}</div>
    }

    <div class="modal-body">
      <!-- Phần trên: mời theo email -->
      <h3 class="modal-section">Mời người dùng</h3>
      <div class="row">
        <input
          class="auth-input"
          type="email"
          placeholder="email@example.com"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
        />
        <button class="btn btn-primary" type="button" [disabled]="busy()" (click)="invite()">
          Mời
        </button>
      </div>

      @for (s of invites(); track s.id) {
        <div class="share-row">
          <span class="mi">person</span>
          <span class="share-email">{{ s.sharedWithEmail }}</span>
          <span class="card-sub">Người xem</span>
          <button class="btn btn-icon" type="button" (click)="revoke(s)">
            <span class="mi" style="color: var(--danger)">remove_circle_outline</span>
          </button>
        </div>
      }

      <!-- Phần dưới: link công khai -->
      <h3 class="modal-section">Link công khai</h3>
      <!-- Sau khi đã tạo link thì ẩn phần tuỳ chọn + nút "Tạo link" (mỗi mục 1 link) -->
      @if (!links().length) {
        <div class="link-opts">
          <label class="opt">
            <input
              type="checkbox"
              [checked]="linkAllowDownload()"
              (change)="linkAllowDownload.set($any($event.target).checked)"
            />
            Cho phép tải xuống
          </label>
          <label class="opt">
            Hết hạn:
            <select
              [value]="linkExpiresDays()"
              (change)="linkExpiresDays.set(+$any($event.target).value)"
            >
              <option [value]="0">Không</option>
              <option [value]="1">1 ngày</option>
              <option [value]="7">7 ngày</option>
              <option [value]="30">30 ngày</option>
            </select>
          </label>
          <input
            class="auth-input"
            style="max-width: 160px"
            type="text"
            placeholder="Mật khẩu (tuỳ chọn)"
            [value]="linkPassword()"
            (input)="linkPassword.set($any($event.target).value)"
          />
          <button class="btn" type="button" [disabled]="busy()" (click)="createLink()">
            Tạo link
          </button>
        </div>
      }

      @for (s of links(); track s.id) {
        <div class="share-row">
          <span class="mi">link</span>
          <input class="auth-input" style="flex: 1" readonly [value]="linkUrl(s)" />
          <button class="btn btn-icon" type="button" (click)="copy(s)" [title]="'Sao chép'">
            <span class="mi">{{ copied() === s.id ? 'check' : 'content_copy' }}</span>
          </button>
          <span class="card-sub">{{ s.viewCount }}👁 {{ s.downloadCount }}⬇</span>
          <button class="btn btn-icon" type="button" (click)="revoke(s)">
            <span class="mi" style="color: var(--danger)">delete</span>
          </button>
        </div>
      }
    </div>
  </div>
</div>
