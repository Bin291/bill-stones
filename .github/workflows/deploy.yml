name: Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend and backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            storage/package-lock.json
            storage-api/package-lock.json

      - name: Install frontend dependencies
        working-directory: storage
        run: npm ci

      - name: Build frontend
        working-directory: storage
        run: npm run build

      - name: Install backend dependencies
        working-directory: storage-api
        run: npm ci

      - name: Build backend
        working-directory: storage-api
        run: npm run build

  deploy-backend-render:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set, skipping backend deploy."
            exit 0
          fi
          curl -fsSL -X POST "${RENDER_DEPLOY_HOOK_URL}"

  deploy-frontend-cloudflare:
    name: Deploy frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storage/package-lock.json

      - name: Install frontend dependencies
        working-directory: storage
        run: npm ci

      - name: Build frontend
        working-directory: storage
        run: npm run build

      - name: Resolve frontend artifact directory
        id: artifact
        run: |
          if [ -d "storage/dist/storage/browser" ]; then
            echo "dir=storage/dist/storage/browser" >> "$GITHUB_OUTPUT"
          elif [ -d "storage/dist/storage" ]; then
            echo "dir=storage/dist/storage" >> "$GITHUB_OUTPUT"
          else
            echo "Cannot find built frontend artifact directory." >&2
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CLOUDFLARE_PAGES_PROJECT_NAME}" ]; then
            echo "Cloudflare secrets are missing, skipping frontend deploy."
            exit 0
          fi
          npx wrangler@4 pages deploy "${{ steps.artifact.outputs.dir }}" --project-name "${CLOUDFLARE_PAGES_PROJECT_NAME}"
