name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend and backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            storage/package-lock.json
            storage-api/package-lock.json

      - name: Install frontend dependencies
        working-directory: storage
        run: npm ci

      - name: Build frontend
        working-directory: storage
        run: npm run build

      - name: Install backend dependencies
        working-directory: storage-api
        run: npm ci

      - name: Build backend
        working-directory: storage-api
        run: npm run build

  deploy-backend-render:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-frontend-cloudflare:
    name: Deploy frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_PAGES_PROJECT_NAME != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storage/package-lock.json

      - name: Install frontend dependencies
        working-directory: storage
        run: npm ci

      - name: Build frontend
        working-directory: storage
        run: npm run build

      - name: Resolve frontend artifact directory
        id: artifact
        run: |
          if [ -d "storage/dist/storage/browser" ]; then
            echo "dir=storage/dist/storage/browser" >> "$GITHUB_OUTPUT"
          elif [ -d "storage/dist/storage" ]; then
            echo "dir=storage/dist/storage" >> "$GITHUB_OUTPUT"
          else
            echo "Cannot find built frontend artifact directory." >&2
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy "${{ steps.artifact.outputs.dir }}" --project-name "${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}"
